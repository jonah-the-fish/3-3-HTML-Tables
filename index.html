<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: The dinner table</title>
        <style>
          table, th, td {
            border: 1px solid;
          }
        </style>
    </head>
    <body>
    
        <h1>Our dinner menu</h1>
      
          <img src="plate_blue.jpg" width="50">
          <img src="plate_yellow.jpg" width="50">

            <thead>
                <tr>
                    <th>Meal</th>

                <tr>

                <tr>
                    <td>Cheese Burger</td>\
                    <td>Beef, cheddar cheese, onions, tomatoes, potato bun</td>

                <tr>
                    <td>Flattened chocolate chip cookies</td>
                    <td>Sugar, flour, eggs, butter, chocolate chips</td>
                    <td>$5</td>
                </tr>
            </tbody>
        </table>


    </body>
